# Configuration of the KitKat NFC stack (libnfc-nci) for the NXP PN553, driven by the Android 11
# NXP HAL through nfcbridge (the HAL loads its own configuration, libnfc-nxp.conf, in the
# chroot). Based on Android 11's libnfc-nci.conf, without secure element or P2P listening:
# reading and writing tags.
APPL_TRACE_LEVEL=0x01
PROTOCOL_TRACE_LEVEL=0x01
NFA_STORAGE="/data/nfc"
POLLING_TECH_MASK=0x07
P2P_LISTEN_TECH_MASK=0x00
UICC_LISTEN_TECH_MASK=0x00
NFA_MAX_EE_SUPPORTED=0x00
SCREEN_OFF_POWER_STATE=1
PRESERVE_STORAGE=0x01
