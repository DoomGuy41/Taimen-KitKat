# GPS configuration of the KitKat framework (GpsLocationProvider).
# Qualcomm XTRA predicted orbits (downloaded when the modem asks for them, then injected through
# gps.taimen/gnssbridge) and NTP time: first fix in tens of seconds instead of minutes.
XTRA_SERVER_1=http://xtrapath1.izatcloud.net/xtra3grc.bin
XTRA_SERVER_2=http://xtrapath2.izatcloud.net/xtra3grc.bin
XTRA_SERVER_3=http://xtrapath3.izatcloud.net/xtra3grc.bin
NTP_SERVER=time.google.com
